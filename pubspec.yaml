name: safefam
description: 세이프팸 — 온 가족 금융사기 지킴이 (UI 스캐폴드)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  kakao_flutter_sdk_user: ^2.0.0+1
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/character.png

  # Pretendard를 쓰려면 폰트 파일을 assets/fonts/ 에 넣고 아래 주석을 해제하세요.
